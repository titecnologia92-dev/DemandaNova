<!DOCTYPE html>
<html>
<head>
    <title>Teste de Conexão Supabase</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Teste de Conexão Supabase</h1>
    
    <div class="test">
        <h3>Teste 1: URL com "aa" (mpxnfgotsaavlvnrwpj)</h3>
        <button onclick="testUrl('https://mpxnfgotsaavlvnrwpj.supabase.co')">Testar</button>
        <div id="result1"></div>
    </div>
    
    <div class="test">
        <h3>Teste 2: URL sem "a" (mpxnfgotsoavlvnrvwpj)</h3>
        <button onclick="testUrl('https://mpxnfgotsoavlvnrvwpj.supabase.co')">Testar</button>
        <div id="result2"></div>
    </div>
    
    <script>
        async function testUrl(url) {
            const resultId = url.includes('aa') ? 'result1' : 'result2';
            const resultDiv = document.getElementById(resultId);
            resultDiv.innerHTML = '<p>Testando...</p>';
            
            try {
                // Teste 1: Verificar se o domínio resolve
                const response = await fetch(`${url}/rest/v1/`, {
                    method: 'GET',
                    headers: {
                        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1weG5mZ290c29hdmx2bnJ2d3BqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI1Nzg3MTMsImV4cCI6MjA3ODE1NDcxM30.u9ZfFk7gqx1AsdRT1s2sxlB24I5SSnF-Vfa9fFOXlAs'
                    }
                });
                
                if (response.ok || response.status === 404) {
                    resultDiv.innerHTML = `<p class="success">✅ URL acessível! Status: ${response.status}</p>`;
                } else {
                    resultDiv.innerHTML = `<p class="error">❌ Erro HTTP: ${response.status}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">❌ Erro: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
